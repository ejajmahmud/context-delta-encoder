[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-delta-encoder"
version = "0.1.0"
description = "Delta encoder transmitting only changed context frames between agent turns to cut input token billing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-delta-encoder = "context_delta_encoder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_delta_encoder*"]
